# Proposed additions INSIDE the existing TEST TLS server{} only.
# Review with existing local TEST config; do not overwrite the server block.
# No public shared Basic credentials. Gateway owns cookie/owner authorization.
location @native_session_test {
    internal;
    set $native_session_uri $upstream_http_x_native_uri;
    proxy_pass http://127.0.0.1:18098$native_session_uri;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Native-URI "";
    proxy_set_header X-Opencode-Directory "";
    proxy_set_header Host 127.0.0.1:18098;
    proxy_hide_header X-Native-URI;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
    add_header Cache-Control "no-store" always;
    add_header X-Accel-Buffering "no" always;
}
location @native_discovery_test {
    internal;
    set $native_discovery_uri $upstream_http_x_native_uri;
    proxy_pass http://127.0.0.1:18097$native_discovery_uri;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Host 127.0.0.1:18097;
    proxy_hide_header X-Native-URI;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
# /native-session/ must remain routed to Gateway via the EXISTING location /.
# Do not create an unauthenticated public proxy to port 18098.
# In the existing loopback 18098 server, add only /permission and /question
# read/reply/reject locations using its EXISTING private Authorization setting.
# Never output that setting with nginx -T. Existing /session and /event unchanged.
