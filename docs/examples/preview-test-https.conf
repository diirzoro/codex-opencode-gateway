# opencode-preview-test-managed-v1: dedicated TEST origin, never Gateway accounts.
# Install only after this dedicated certificate exists and passes validation.
server {
    listen 80;
    server_name preview-test.opencode-gateway.codes;
    access_log off;
    error_log /dev/null;
    add_header Referrer-Policy "no-referrer" always;
    if ($host != preview-test.opencode-gateway.codes) { return 444; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/opencode-preview-acme-test;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name preview-test.opencode-gateway.codes;
    ssl_certificate /etc/letsencrypt/live/preview-test.opencode-gateway.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview-test.opencode-gateway.codes/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null;
    add_header Referrer-Policy "no-referrer" always;
    if ($host != preview-test.opencode-gateway.codes) { return 444; }

    location /preview/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host preview-test.opencode-gateway.codes;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache off;
        proxy_no_cache 1;
        proxy_hide_header Set-Cookie;
        # Preserve Gateway CSP; no allow-same-origin or credentialed CORS.
        # Explicit server-level add_header prevents inheriting a global DENY;
        # Gateway still supplies DENY itself on rejected requests.
    }
    location / { return 404; }
}
