# opencode-preview-test-managed-v1: HTTP ACME only; no account/application proxy.
server {
    listen 80;
    server_name preview-test.opencode-gateway.codes;
    access_log off;
    error_log /dev/null;
    add_header Referrer-Policy "no-referrer" always;
    if ($host != preview-test.opencode-gateway.codes) { return 444; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/opencode-preview-acme-test;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
