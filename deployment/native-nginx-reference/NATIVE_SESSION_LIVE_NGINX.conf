# LIVE Native First: include ONLY inside the existing HTTPS server block for
# opencode-gateway.codes (preserve TLS, DNS, redirects, location / and upstream 8000).
# All Native upstreams are private; shared with TEST's ONE existing OpenCode service.
# Never copy the TEST public server block or replace /etc/nginx wholesale.
#
# Prerequisite: private listeners 127.0.0.1:18097/18098 must already proxy
# securely to the existing 127.0.0.2:4097 Native service; verify live configuration.
# The client never calls these proxy listeners directly.
location @native_session_live {
    internal;
    set $native_session_uri $upstream_http_x_native_uri;
    proxy_pass http://127.0.0.1:18098$native_session_uri;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Native-URI "";
    proxy_set_header X-Opencode-Directory "";
    proxy_set_header Host 127.0.0.1:18098;
    proxy_hide_header X-Native-URI;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
    add_header Cache-Control "no-store" always;
    add_header X-Accel-Buffering "no" always;
}
location @native_discovery_live {
    internal;
    set $native_discovery_uri $upstream_http_x_native_uri;
    proxy_pass http://127.0.0.1:18097$native_discovery_uri;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Host 127.0.0.1:18097;
    proxy_hide_header X-Native-URI;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
# /native-session/ must STILL be routed through the existing LIVE Gateway 8000
# for authorization before Nginx honors X-Accel-Redirect.
# Never expose raw Native/18097/18098 to the Internet.
