name: TEST migration inventory (read-only, one time)
on:
  push:
    branches: [updates]
    paths: ['.github/workflows/test-migration-inventory-once.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 8
    steps:
      - name: Configure existing TEST SSH
        env:
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only comparison of TEST Alembic files
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -T -p "${PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'python3 -' <<'PY'
          import ast
          from pathlib import Path
          root=Path('/home/tahir/opencode-gateway-test')
          target=root/'backend/alembic/versions'
          revisions={}
          for p in sorted(target.glob('*.py')):
              if p.name=='__init__.py':continue
              try:
                  assignments={}
                  for node in ast.parse(p.read_text('utf-8')).body:
                      if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name) and node.targets[0].id in {'revision','down_revision'}:
                          assignments[node.targets[0].id]=ast.literal_eval(node.value)
                  rev=assignments.get('revision')
                  parent=assignments.get('down_revision')
                  print('TEST_MIGRATION',p.name,'REV',rev,'PARENT',parent)
                  revisions[rev]=(p.name,parent)
              except Exception as error:
                  print('TEST_MIGRATION_PARSE_ERROR',p.name,type(error).__name__)
          heads=sorted(str(r) for r in revisions if not any(r==parent for name,parent in revisions.values()))
          missing=sorted(str(parent) for name,parent in revisions.values() if parent is not None and parent not in revisions)
          print('TEST_MIGRATION_TOTAL',len(revisions))
          print('TEST_MIGRATION_HEADS',','.join(heads))
          print('TEST_MIGRATION_MISSING',','.join(missing))
          print('TEST_RELEASE_MARKER', (root/'.test-full-release-revision').read_text().strip() if (root/'.test-full-release-revision').exists() else 'none')
          PY
