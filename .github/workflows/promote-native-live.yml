name: LIVE | Promote master

on:
  push:
    branches: [master]
    paths: ['.github/workflows/promote-native-live.yml']
  workflow_dispatch:
    inputs:
      vps_username:
        description: 'VPS username. The sudo password is stored as a protected production secret.'
        required: true
        type: string
        default: 'tahir'

permissions:
  contents: read

concurrency:
  # Exactly one LIVE deployment at a time.
  group: opencode-live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Fast release syntax check (no test suite or dependency installation)
        run: |
          set -euo pipefail
          bash -n scripts/live-native-promote.sh
          python3 -m py_compile scripts/sync-test-platform-integrations.py scripts/live-integration-diagnostics.py
      - name: Prepare SSH from existing GitHub secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ github.event_name == 'workflow_dispatch' && inputs.vps_username || secrets.VPS_USER }}
          EXPECTED_VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USER:?Missing VPS username}"
          : "${EXPECTED_VPS_USER:?Configure existing VPS_USER secret}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          : "${VPS_SUDO_PASSWORD:?Set VPS_SUDO_PASSWORD as a protected production Actions secret}"
          [[ "$VPS_USER" == "$EXPECTED_VPS_USER" ]] || { echo "Selected username does not match configured production SSH user"; exit 1; }
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Invalid SSH username"; exit 1; }
          port="${VPS_SSH_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -p "$port" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'mkdir -p "$HOME/opencode-gateway-release"'
      - name: Audit TEST integration settings (missing TEST encryption key does not block code deployment)
        id: test_integrations
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ github.event_name == 'workflow_dispatch' && inputs.vps_username || secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          : "${VPS_SUDO_PASSWORD:?Missing protected production sudo secret}"
          [[ "$VPS_SUDO_PASSWORD" != *$'\n'* ]] || { echo "Invalid multi-line sudo secret"; exit 1; }
          port="${VPS_SSH_PORT:-22}"
          # Password travels only through encrypted SSH stdin, not logs or CLI.
          # Remote shell consumes the first line; Python reads the script on stdin
          # and the sudo credential from a separate inherited file descriptor.
          set +e
          audit_output="$(
            { printf '%s\n' "$VPS_SUDO_PASSWORD"; cat scripts/sync-test-platform-integrations.py; } |
              ssh -T -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
                'IFS= read -r sudo_auth; exec 3<<< "$sudo_auth"; unset sudo_auth; exec "$HOME/opencode-gateway/.venv/bin/python" - audit' 2>&1
          )"
          audit_status=$?
          set -e
          if [[ "$audit_status" -eq 0 ]]; then
            printf '%s\n' "$audit_output"
            echo 'migration=ready' >> "$GITHUB_OUTPUT"
          elif grep -Fq 'INTEGRATIONS_SYNC_FAILED=TEST_ENCRYPTION_KEY_MISSING' <<< "$audit_output"; then
            echo '::warning::TEST encryption key missing. LIVE application deploy will continue; Resend and GitHub credentials will not be copied.'
            echo 'migration=skipped_missing_test_key' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$audit_output" >&2
            exit "$audit_status"
          fi

      - name: Upload source; leave LIVE .env and data untouched
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ github.event_name == 'workflow_dispatch' && inputs.vps_username || secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          rsync -az \
            --exclude='.git/' --exclude='.github/' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='.venv/' --exclude='node_modules/' \
            --exclude='runtime/' --exclude='workspaces/' \
            --exclude='receipts/' --exclude='logs/' \
            -e "ssh -p $port" ./ "$VPS_USER@$VPS_HOST:~/opencode-gateway-release/"
      - name: Promote LIVE with operator-authorized sudo (password never logged)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ github.event_name == 'workflow_dispatch' && inputs.vps_username || secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          : "${VPS_SUDO_PASSWORD:?Missing protected production VPS_SUDO_PASSWORD secret}"
          port="${VPS_SSH_PORT:-22}"
          # Password goes only through encrypted SSH standard input.
          # Never pass it via a workflow input, CLI argument, file or log.
          printf '%s\n' "$VPS_SUDO_PASSWORD" | ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'PROMOTE_NATIVE_LIVE_CONFIRM=promote LIVE_SUDO_PASS_STDIN=1 bash "$HOME/opencode-gateway-release/scripts/live-native-promote.sh"'
      - name: Synchronize encrypted TEST Resend and GitHub App settings into LIVE
        if: steps.test_integrations.outputs.migration == 'ready'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ github.event_name == 'workflow_dispatch' && inputs.vps_username || secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          : "${VPS_SUDO_PASSWORD:?Missing protected production sudo secret}"
          [[ "$VPS_SUDO_PASSWORD" != *$'\n'* ]] || { echo "Invalid multi-line sudo secret"; exit 1; }
          port="${VPS_SSH_PORT:-22}"
          # Password travels only through encrypted SSH stdin, not logs or CLI.
          # Remote shell consumes the first line; Python reads the script on stdin
          # and the sudo credential from a separate inherited file descriptor.
          { printf '%s\n' "$VPS_SUDO_PASSWORD"; cat scripts/sync-test-platform-integrations.py; } |
            ssh -T -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
              'IFS= read -r sudo_auth; exec 3<<< "$sudo_auth"; unset sudo_auth; exec "$HOME/opencode-gateway/.venv/bin/python" - apply'

      - name: Confirm production domain routes to LIVE backend
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 https://opencode-gateway.codes/api/health
          echo
          echo "LIVE basic health passed. Authenticated Native/SSE acceptance still required."
      - name: Report LIVE registration and GitHub integration readiness
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ github.event_name == 'workflow_dispatch' && inputs.vps_username || secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd "$HOME/opencode-gateway/backend" && set -a && . "$HOME/opencode-gateway/.env" && set +a && exec ../.venv/bin/python -' \
            < scripts/live-integration-diagnostics.py
