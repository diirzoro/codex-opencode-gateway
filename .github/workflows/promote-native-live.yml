name: Promote approved Native First source to LIVE

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type promote to deploy LIVE source and migrations"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-native-first-live
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/master' && inputs.confirmation == 'promote'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile, migration chain and syntax
        run: |
          python -m compileall -q backend/app
          python scripts/validate_migration_chain.py
          bash -n scripts/live-native-promote.sh
      - name: Native ownership, LIVE boundaries and email regressions
        run: |
          python -m pytest -q \
            backend/tests/test_native_control_plane.py \
            backend/tests/test_native_security_performance.py \
            backend/tests/test_email_verification_contracts.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare SSH from existing GitHub secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          port="${VPS_SSH_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -p "$port" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'mkdir -p "$HOME/opencode-gateway-release" "$HOME/opencode-backups"'
      - name: Upload source; leave LIVE .env and data untouched
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          rsync -az --delete \
            --exclude='.git/' --exclude='.github/' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='.venv/' --exclude='node_modules/' \
            --exclude='runtime/' --exclude='workspaces/' \
            --exclude='receipts/' --exclude='logs/' \
            -e "ssh -p $port" ./ "$VPS_USER@$VPS_HOST:~/opencode-gateway-release/"
      - name: Validate LIVE; promote code and schema without backup or cleanup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          ssh -p "$port" "$VPS_USER@$VPS_HOST" \
            'PROMOTE_NATIVE_LIVE_CONFIRM=promote bash "$HOME/opencode-gateway-release/scripts/live-native-promote.sh"'
      - name: Confirm production domain routes to LIVE backend
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 https://opencode-gateway.codes/api/health
          echo
          echo "LIVE basic health passed. Authenticated Native/SSE acceptance still required."
