name: LIVE | Promote master

on:
  workflow_dispatch:
    inputs:
      vps_username:
        description: 'VPS username. The sudo password is stored as a protected production secret.'
        required: true
        type: string
        default: 'tahir'

permissions:
  contents: read

concurrency:
  # Exactly one LIVE deployment at a time.
  group: opencode-live-deploy
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile, migration chain and syntax
        run: |
          python -m compileall -q backend/app
          python scripts/validate_migration_chain.py
          bash -n scripts/live-native-promote.sh
          python -m py_compile scripts/live-integration-diagnostics.py
          python -m py_compile scripts/sync-test-platform-integrations.py
          test -s docs/NATIVE_SESSION_LIVE_NGINX.conf
      - name: Native ownership, LIVE boundaries and email regressions
        run: |
          python -m pytest -q \
            backend/tests/test_native_control_plane.py \
            backend/tests/test_native_security_performance.py \
            backend/tests/test_email_verification_contracts.py \
            backend/tests/test_live_integration_sync.py

      - name: Full authorization, account and attachment regression suite
        run: |
          python -m pytest -q \
            backend/tests/test_github_boundaries.py \
            backend/tests/test_github_disconnect_review.py \
            backend/tests/test_email_code_signup.py \
            backend/tests/test_registration_identity_uniqueness.py \
            backend/tests/test_github_email_ownership.py \
            backend/tests/test_admin_account_controls.py \
            backend/tests/test_chat_attachments.py \
            backend/tests/test_native_24h_retention.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax and protected browser flows
        run: |
          set -euo pipefail
          for file in app.js dashboards.js enhancements.js management.js native-session-client.js runtime-client.js; do node --check "$file"; done
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          node tests/browser/test-github-email-proof.cjs
          node tests/browser/test-native-ux.cjs
          node tests/browser/test-admin-account-removal.cjs
          node tests/browser/test-admin-users-table.cjs
          node tests/browser/test-admin-user-editor.cjs
          node tests/browser/test-existing-account-recovery.cjs

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout reviewed master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Prepare SSH from existing GitHub secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ inputs.vps_username }}
          EXPECTED_VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USER:?Missing VPS username}"
          : "${EXPECTED_VPS_USER:?Configure existing VPS_USER secret}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          : "${VPS_SUDO_PASSWORD:?Set VPS_SUDO_PASSWORD as a protected production Actions secret}"
          [[ "$VPS_USER" == "$EXPECTED_VPS_USER" ]] || { echo "Selected username does not match configured production SSH user"; exit 1; }
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Invalid SSH username"; exit 1; }
          port="${VPS_SSH_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -p "$port" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'mkdir -p "$HOME/opencode-gateway-release"'
      - name: Audit TEST integration settings before touching LIVE
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ inputs.vps_username }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            '"$HOME/opencode-gateway/.venv/bin/python" - audit' \
            < scripts/sync-test-platform-integrations.py

      - name: Upload source; leave LIVE .env and data untouched
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ inputs.vps_username }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          rsync -az \
            --exclude='.git/' --exclude='.github/' \
            --exclude='.env' --exclude='.env.*' \
            --exclude='.venv/' --exclude='node_modules/' \
            --exclude='runtime/' --exclude='workspaces/' \
            --exclude='receipts/' --exclude='logs/' \
            -e "ssh -p $port" ./ "$VPS_USER@$VPS_HOST:~/opencode-gateway-release/"
      - name: Promote LIVE with operator-authorized sudo (password never logged)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ inputs.vps_username }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          : "${VPS_SUDO_PASSWORD:?Missing protected production VPS_SUDO_PASSWORD secret}"
          port="${VPS_SSH_PORT:-22}"
          # Password goes only through encrypted SSH standard input.
          # Never pass it via a workflow input, CLI argument, file or log.
          printf '%s\n' "$VPS_SUDO_PASSWORD" | ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'PROMOTE_NATIVE_LIVE_CONFIRM=promote LIVE_SUDO_PASS_STDIN=1 bash "$HOME/opencode-gateway-release/scripts/live-native-promote.sh"'
      - name: Synchronize encrypted TEST Resend and GitHub App settings into LIVE
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ inputs.vps_username }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            '"$HOME/opencode-gateway/.venv/bin/python" - apply' \
            < scripts/sync-test-platform-integrations.py

      - name: Confirm production domain routes to LIVE backend
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 https://opencode-gateway.codes/api/health
          echo
          echo "LIVE basic health passed. Authenticated Native/SSE acceptance still required."
      - name: Report LIVE registration and GitHub integration readiness
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ inputs.vps_username }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd "$HOME/opencode-gateway/backend" && set -a && . "$HOME/opencode-gateway/.env" && set +a && exec ../.venv/bin/python -' \
            < scripts/live-integration-diagnostics.py
