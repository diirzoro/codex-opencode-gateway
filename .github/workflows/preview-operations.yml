name: Preview | Existing worker operations
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Existing preview worker operation
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - prepare
permissions:
  contents: read
concurrency:
  group: opencode-preview-operations
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read existing preview server state
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?}" "${VPS_USER:?}" "${VPS_SSH_KEY:?}" "${VPS_SUDO_PASSWORD:?}"
          port="${VPS_SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [[ -n "$VPS_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$port" -H "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          [[ "$OPERATION" == inspect || "$OPERATION" == prepare ]]
          ssh -T -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'mkdir -p /home/tahir/preview-activation'
          tar -czf /tmp/preview-activation.tgz scripts/preview-host-*.sh deploy/preview-python.Dockerfile deploy/apparmor-preview backend/app/services/preview*.py
          scp -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            /tmp/preview-activation.tgz "$VPS_USER@$VPS_HOST:/home/tahir/preview-activation.tgz"
          ssh -T -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'tar -xzf /home/tahir/preview-activation.tgz -C /home/tahir/preview-activation'
          script=preview-host-inspect.sh
          [[ "$OPERATION" != prepare ]] || script=preview-host-prepare.sh
          printf '%s\n' "$VPS_SUDO_PASSWORD" | ssh -T -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "sudo -S -p '' bash /home/tahir/preview-activation/scripts/$script"
