name: Preview | Existing worker operations
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Existing preview worker operation
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - prepare
          - activate
          - verify
          - react_inspect
          - audit
          - audit_full
          - react_activate
          - java_activate
permissions:
  contents: read
concurrency:
  group: opencode-preview-operations
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read existing preview server state
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?}" "${VPS_USER:?}" "${VPS_SSH_KEY:?}" "${VPS_SUDO_PASSWORD:?}"
          port="${VPS_SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [[ -n "$VPS_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$port" -H "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          [[ "$OPERATION" == inspect || "$OPERATION" == prepare || "$OPERATION" == activate || "$OPERATION" == verify || "$OPERATION" == react_inspect || "$OPERATION" == audit || "$OPERATION" == audit_full || "$OPERATION" == react_activate || "$OPERATION" == java_activate ]]
          ssh -T -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'mkdir -p /home/tahir/preview-activation'
          mkdir -p preview-wheels
          if [[ "$OPERATION" == prepare ]]; then
            python3 -m pip download --only-binary=:all: --python-version 312 \
              --platform manylinux_2_17_x86_64 --implementation cp --abi cp312 \
              --dest preview-wheels 'fastapi>=0.115.6,<1' 'uvicorn>=0.34.0,<1'
            (cd preview-wheels && sha256sum *.whl > SHA256SUMS)
          fi
          tar -czf /tmp/preview-activation.tgz scripts/preview-host-*.sh scripts/preview-react-inspect.py scripts/preview-runtime-audit.py dashboards.js deploy/apparmor-preview deploy/PreviewFetch.java backend/app/services/preview*.py preview-wheels
          scp -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            /tmp/preview-activation.tgz "$VPS_USER@$VPS_HOST:/home/tahir/preview-activation.tgz"
          ssh -T -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'tar -xzf /home/tahir/preview-activation.tgz -C /home/tahir/preview-activation'
          script=preview-host-inspect.sh
          [[ "$OPERATION" != prepare ]] || script=preview-host-prepare.sh
          [[ "$OPERATION" != activate ]] || script=preview-host-activate.sh
          [[ "$OPERATION" != verify ]] || script=preview-host-verify.sh
          [[ "$OPERATION" != react_inspect ]] || script=preview-host-react-inspect.sh
          [[ "$OPERATION" != audit ]] || script=preview-host-audit.sh
          [[ "$OPERATION" != audit_full ]] || script=preview-host-audit-full.sh
          [[ "$OPERATION" != react_activate ]] || script=preview-host-react-activate.sh
          [[ "$OPERATION" != java_activate ]] || script=preview-host-java-activate.sh
          printf '%s\n' "$VPS_SUDO_PASSWORD" | ssh -T -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "sudo -S -p '' bash /home/tahir/preview-activation/scripts/$script"
