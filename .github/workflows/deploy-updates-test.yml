name: TEST | Validate and deploy updates
on:
  push:
    branches: [updates]
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      vps_username:
        description: "VPS username (same as LIVE)"
        required: true
        type: string
        default: tahir
      confirmation:
        description: "TEST: push to updates deploys automatically; dispatch permits audit, deploy or rollback"
        required: true
        type: choice
        default: audit-test
        options:
          - audit-test
          - deploy-test
          - rollback-test
      rollback_sha:
        description: "Only for rollback-test: previous GitHub updates commit SHA (40 hex characters)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: opencode-test-deploy
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/updates' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Confirm TEST operation
        id: confirm
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          mode="$(printf '%s' "$CONFIRMATION" | tr -d '[:space:]')"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then mode=deploy-test; fi
          [[ "$mode" == "audit-test" || "$mode" == "deploy-test" || "$mode" == "rollback-test" ]]
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_REF" == "refs/heads/updates" ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate full TEST source and migration chain
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/full_test_git_release.py
          python3 -m compileall -q backend/app backend/alembic/versions
          python3 - <<'PY'
          import pathlib, ast
          versions=sorted(pathlib.Path('backend/alembic/versions').glob('*.py'))
          assert versions, 'No Alembic migrations found'
          revisions={}
          for path in versions:
              tree=ast.parse(path.read_text(encoding='utf-8'))
              values={node.targets[0].id:ast.literal_eval(node.value) for node in tree.body if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name) and node.targets[0].id in ('revision','down_revision')}
              assert values.get('revision') and values['revision'] not in revisions, path
              revisions[values['revision']]=values.get('down_revision')
          assert revisions['0024_github_app_settings']=='0023_admin_mail_drafts'
          assert set(revisions.values())-set(revisions)-{None}==set(), 'Broken Alembic revision chain'
          assert pathlib.Path('backend/alembic/versions/0022_email_service_policies.py').is_file()
          assert pathlib.Path('backend/app/services/admin_email_config.py').is_file()
          assert pathlib.Path('index.html').is_file()
          print('FULL_SOURCE_PREFLIGHT_SUCCESS',len(versions),'migrations')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend authorization, account, Native and attachment regressions
        run: |
          python -m pytest -q \
            backend/tests/test_github_boundaries.py \
            backend/tests/test_github_disconnect_review.py \
            backend/tests/test_email_verification_contracts.py \
            backend/tests/test_email_code_signup.py \
            backend/tests/test_registration_identity_uniqueness.py \
            backend/tests/test_github_email_ownership.py \
            backend/tests/test_admin_account_controls.py \
            backend/tests/test_native_security_performance.py \
            backend/tests/test_native_control_plane.py \
            backend/tests/test_chat_attachments.py \
            backend/tests/test_native_24h_retention.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend syntax
        run: |
          set -euo pipefail
          for file in app.js dashboards.js enhancements.js management.js native-session-client.js runtime-client.js; do
            node --check "$file"
          done
      - name: Test protected browser flows
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          node tests/browser/test-github-email-proof.cjs
          node tests/browser/test-native-ux.cjs
          node tests/browser/test-admin-account-removal.cjs
          node tests/browser/test-admin-users-table.cjs
          node tests/browser/test-admin-user-editor.cjs
          node tests/browser/test-existing-account-recovery.cjs
      - name: Configure pinned SSH for TEST
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ inputs.vps_username || 'tahir' }}
          EXPECTED_VPS_USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING_HOST}"
          : "${USER:?Missing VPS username}"
          : "${EXPECTED_VPS_USER:?Missing VPS_USER secret}"
          [[ "$USER" == "$EXPECTED_VPS_USER" ]] || { echo "VPS username does not match existing VPS_USER secret"; exit 1; }
          : "${KEY:?Missing STAGING_SSH_PRIVATE_KEY}"
          : "${KNOWN_HOSTS:?Missing STAGING_SSH_KNOWN_HOSTS}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect TEST identity and service health
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ inputs.vps_username || 'tahir' }}
          EXPECTED_VPS_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            'test "$HOME" = /home/tahir && test -d /home/tahir/opencode-gateway-test/.git && test -f /home/tahir/opencode-gateway-test/.env && systemctl is-active --quiet opencode-gateway-test.service && systemctl is-active --quiet opencode-native-test.service'
      - name: Full TEST audit or deploy by pinned GitHub commit
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ inputs.vps_username || 'tahir' }}
          EXPECTED_VPS_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
          TARGET_SHA: ${{ github.sha }}
          MODE: ${{ steps.confirm.outputs.mode }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          # Read the approved script directly from the reviewed GitHub revision.
          # Git checkout and app source are preserved; no server .env, IP, port,
          # nginx, systemd, database files, Native engine, or LIVE changes.
          operation=audit
          if [[ "$MODE" == "deploy-test" ]]; then operation=deploy; fi
          if [[ "$MODE" == "rollback-test" ]]; then
            operation=rollback
            [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Supply an exact 40-character GitHub commit SHA for rollback"; exit 1; }
            TARGET_SHA="$ROLLBACK_SHA"
          fi
          : "${VPS_SUDO_PASSWORD:?Missing protected VPS_SUDO_PASSWORD secret}"
          [[ "$VPS_SUDO_PASSWORD" != *$'\n'* ]] || { echo "Invalid multi-line sudo secret"; exit 1; }
          # Password travels only over encrypted SSH stdin; never in log or CLI arguments.
          printf '%s\n' "$VPS_SUDO_PASSWORD" | ssh -T -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "cd /home/tahir/opencode-gateway-test && git fetch --no-tags origin updates </dev/null && ( test '$operation' = rollback || test \"\$(git rev-parse origin/updates)\" = '$TARGET_SHA' ) && git show 'origin/updates:scripts/full_test_git_release.py' > /home/tahir/.full-test-git-release.py && chmod 600 /home/tahir/.full-test-git-release.py && TEST_SUDO_PASS_STDIN=1 python3 -I /home/tahir/.full-test-git-release.py $operation '$TARGET_SHA'"
      - name: Verify TEST health after TEST operation
        if: steps.confirm.outputs.mode != 'audit-test'
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 2 https://test.opencode-gateway.codes/api/health
          echo
      - name: Report scope
        if: always()
        run: |
          echo "TEST only: full tracked application source, excluding server .env, protected runtime, OS/Nginx/systemd configuration, Preview, LIVE and Native engine. Database upgrades require explicit safe gate; rollback is by Git commit, not backup copies." >> "$GITHUB_STEP_SUMMARY"
