name: TEST | Fast deploy updates (manual audit optional)
on:
  push:
    branches: [updates]
    paths-ignore:
      - 'docs/**'
      - 'assets/native-direct/**'
      - 'ops/native-direct/**'
  workflow_dispatch:
    inputs:
      vps_username:
        description: "VPS username (same as LIVE)"
        required: true
        type: string
        default: tahir
      confirmation:
        description: "TEST: push to updates deploys automatically; dispatch permits audit, deploy or rollback"
        required: true
        type: choice
        default: audit-test
        options:
          - audit-test
          - deploy-test
          - rollback-test
      rollback_sha:
        description: "Only for rollback-test: previous GitHub updates commit SHA (40 hex characters)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: opencode-test-deploy
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/updates' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Confirm TEST operation
        id: confirm
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          mode="$(printf '%s' "$CONFIRMATION" | tr -d '[:space:]')"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mode=deploy-test
            if [[ "$COMMIT_MESSAGE" == 'ci(test): inspect direct Native transport' ]]; then mode=native-probe; fi
            if [[ "$COMMIT_MESSAGE" == 'native(test): install direct OpenCode chat' ]]; then mode=native-install; fi
          fi
          [[ "$mode" == "audit-test" || "$mode" == "deploy-test" || "$mode" == "rollback-test" || "$mode" == "native-probe" || "$mode" == "native-install" ]]
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_REF" == "refs/heads/updates" ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate full TEST source and migration chain
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/full_test_git_release.py
          python3 -m compileall -q backend/app backend/alembic/versions
          python3 - <<'PY'
          import pathlib, ast
          versions=sorted(pathlib.Path('backend/alembic/versions').glob('*.py'))
          assert versions, 'No Alembic migrations found'
          revisions={}
          for path in versions:
              tree=ast.parse(path.read_text(encoding='utf-8'))
              values={node.targets[0].id:ast.literal_eval(node.value) for node in tree.body if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name) and node.targets[0].id in ('revision','down_revision')}
              assert values.get('revision') and values['revision'] not in revisions, path
              revisions[values['revision']]=values.get('down_revision')
          assert revisions['0024_github_app_settings']=='0023_admin_mail_drafts'
          assert set(revisions.values())-set(revisions)-{None}==set(), 'Broken Alembic revision chain'
          assert pathlib.Path('backend/alembic/versions/0022_email_service_policies.py').is_file()
          assert pathlib.Path('backend/app/services/admin_email_config.py').is_file()
          assert pathlib.Path('index.html').is_file()
          print('FULL_SOURCE_PREFLIGHT_SUCCESS',len(versions),'migrations')
          PY
      # QA is opt-in via workflow_dispatch → audit-test.
      # Normal updates pushes deploy immediately after the small source preflight.
      # Failed optional tests never block regular TEST releases.
      - uses: actions/setup-python@v5
        if: steps.confirm.outputs.mode == 'audit-test'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        if: steps.confirm.outputs.mode == 'audit-test'
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend authorization, account, Native and attachment regressions
        if: steps.confirm.outputs.mode == 'audit-test'
        run: |
          python -m pytest -q \
            backend/tests/test_github_boundaries.py \
            backend/tests/test_github_disconnect_review.py \
            backend/tests/test_email_verification_contracts.py \
            backend/tests/test_email_code_signup.py \
            backend/tests/test_registration_identity_uniqueness.py \
            backend/tests/test_github_email_ownership.py \
            backend/tests/test_admin_account_controls.py \
            backend/tests/test_native_security_performance.py \
            backend/tests/test_native_control_plane.py \
            backend/tests/test_chat_attachments.py \
            backend/tests/test_native_24h_retention.py
      - uses: actions/setup-node@v4
        if: steps.confirm.outputs.mode == 'audit-test'
        with:
          node-version: '22'
      - name: Validate frontend syntax
        if: steps.confirm.outputs.mode == 'audit-test'
        run: |
          set -euo pipefail
          for file in app.js dashboards.js enhancements.js management.js native-session-client.js runtime-client.js; do
            node --check "$file"
          done
      - name: Test protected browser flows
        if: steps.confirm.outputs.mode == 'audit-test'
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          node tests/browser/test-github-email-proof.cjs
          node tests/browser/test-native-ux.cjs
          node tests/browser/test-admin-account-removal.cjs
          node tests/browser/test-admin-users-table.cjs
          node tests/browser/test-admin-user-editor.cjs
          node tests/browser/test-existing-account-recovery.cjs
      - name: Configure pinned SSH for TEST
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ inputs.vps_username || 'tahir' }}
          EXPECTED_VPS_USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING_HOST}"
          : "${USER:?Missing VPS username}"
          : "${EXPECTED_VPS_USER:?Missing VPS_USER secret}"
          [[ "$USER" == "$EXPECTED_VPS_USER" ]] || { echo "VPS username does not match existing VPS_USER secret"; exit 1; }
          : "${KEY:?Missing STAGING_SSH_PRIVATE_KEY}"
          : "${KNOWN_HOSTS:?Missing STAGING_SSH_KNOWN_HOSTS}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect TEST identity and service health
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ inputs.vps_username || 'tahir' }}
          EXPECTED_VPS_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            'test "$HOME" = /home/tahir && test -d /home/tahir/opencode-gateway-test/.git && test -f /home/tahir/opencode-gateway-test/.env && systemctl is-active --quiet opencode-gateway-test.service && systemctl is-active --quiet opencode-native-test.service'
      - name: Inspect TEST Native locally without Gateway or database
        if: steps.confirm.outputs.mode == 'native-probe'
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ inputs.vps_username || 'tahir' }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -s' <<'NATIVE_DIAG'
          set -e
          echo "NATIVE_DIRECT_PROBE_START"
          systemctl show opencode-native-test.service -p ActiveState -p MainPID
          for endpoint in 'http://127.0.0.2:4097/global/health' 'http://127.0.0.2:4097/provider' 'http://127.0.0.1:18097/provider' 'http://127.0.0.1:18098/session/status'; do
            echo "PROBE=${endpoint}"
            curl --silent --show-error --max-time 6 --output /dev/null --write-out 'STATUS=%{http_code} TTFB=%{time_starttransfer} TOTAL=%{time_total}\n' "$endpoint" || true
          done
          for config in /etc/nginx/sites-enabled/*; do
            if test -f "$config" && grep -q 'test.opencode-gateway.codes' "$config"; then
              echo "TEST_NGINX_FILE=${config}"
              grep -E '^[[:space:]]*(server_name|location|proxy_pass)[[:space:]]' "$config" | head -n 35 || true
            fi
          done
          # Native-only real-model smoke test through local Nginx, without Python.
          umask 077
          provider_json="$(mktemp)"
          session_json="$(mktemp)"
          message_json="$(mktemp)"
          event_markers="$(mktemp)"
          trap 'rm -f "$provider_json" "$session_json" "$message_json" "$event_markers"' EXIT
          directory='/var/lib/opencode-native-test/workspace'
          echo "NATIVE_JSON_TOOL=$(command -v jq || echo unavailable)"
          code="$(curl -sS -G --max-time 40 --data-urlencode "directory=$directory" -o "$provider_json" -w '%{http_code}' http://127.0.0.1:18097/provider)" || code=000
          echo "NATIVE_PROVIDER_HTTP=$code SIZE=$(wc -c < "$provider_json")"
          echo "NATIVE_PROVIDER_EXTERNAL_CONNECTIVITY"
          curl --silent --show-error --max-time 12 --output /dev/null --write-out 'OPEN_CODE_WEBSITE_HTTP=%{http_code} TTFB=%{time_starttransfer}\n' 'https://opencode.ai/' || true
          curl --silent --show-error --max-time 12 --output /dev/null --write-out 'ZEN_API_HTTP=%{http_code} TTFB=%{time_starttransfer}\n' 'https://opencode.ai/zen/v1/models' || true
          echo "NATIVE_LOG_DIR_STATUS"
          if test -d /var/lib/opencode-native-test/data/log; then
            find /var/lib/opencode-native-test/data/log -maxdepth 1 -type f -name '*.log' -printf 'NATIVE_LOG_FILE_AGE_SECONDS=%T@\n' 2>/dev/null | tail -n 3 || true
          fi
          # Direct local OpenCode diagnostic, never through Python/Gateway.
          list_json="$(mktemp)"
          status_json="$(mktemp)"
          trap 'rm -f "$provider_json" "$session_json" "$message_json" "$event_markers" "$list_json" "$status_json"' EXIT
          suffix='?directory=/var/lib/opencode-native-test/workspace'
          if [[ "$code" == 200 ]] && command -v jq >/dev/null 2>&1; then
            echo "NATIVE_FREE_MODELS_BEGIN"
            jq -r '.all[]? | select(.id=="opencode") | .models | to_entries[]? | select(.value.cost.input==0 and .value.cost.output==0) | .key' "$provider_json" | head -n 12
            echo "NATIVE_FREE_MODELS_END"
          fi
          list_code="$(curl -sS --max-time 20 -o "$list_json" -w '%{http_code}' "http://127.0.0.1:18098/session$suffix")" || list_code=000
          echo "NATIVE_RECENT_SESSIONS_HTTP=$list_code"
          if [[ "$list_code" == 200 ]] && command -v jq >/dev/null 2>&1; then
            latest="$(jq -r '[.[] | select(.title=="Native transport direct smoke TEST")] | sort_by(.time.created) | last | .id // empty' "$list_json")"
            if [[ "$latest" =~ ^ses_[A-Za-z0-9_-]+$ ]]; then
              state_code="$(curl -sS --max-time 15 -o "$status_json" -w '%{http_code}' "http://127.0.0.1:18098/session/status$suffix")" || state_code=000
              echo "NATIVE_EXISTING_SESSION_STATUS_HTTP=$state_code"
              if [[ "$state_code" == 200 ]]; then
                jq -r --arg sid "$latest" '.[$sid] | "NATIVE_TEST_SESSION_STATE=\(.type // "idle_or_unknown") ATTEMPT=\(.attempt // "none") RETRY_CATEGORY=\((.message // "" | tostring) | if test("rate|limit|quota";"i") then "rate_limit" elif test("auth|credential|unauthor";"i") then "authentication" elif test("connect|network|timeout|gateway";"i") then "network" elif test("model|not found";"i") then "model" else "undetermined" end)"' "$status_json"
                jq -r --arg sid "$latest" '.[$sid] | keys | "NATIVE_STATUS_FIELDS=" + join(",")' "$status_json"
                jq -r --arg sid "$latest" '.[$sid].message // "" | tostring | gsub("[A-Za-z0-9_-]{24,}";"[REDACTED]") | .[0:180] | "NATIVE_RETRY_NOTE=" + .' "$status_json"
              fi
              reply_code="$(curl -sS --max-time 25 -o "$message_json" -w '%{http_code}' "http://127.0.0.1:18098/session/$latest/message$suffix")" || reply_code=000
              echo "NATIVE_EXISTING_MESSAGE_HTTP=$reply_code"
              if [[ "$reply_code" == 200 ]]; then
                jq -r '[.[] | select(.info.role=="assistant")] | "ASSISTANT_TURNS=\(length) TEXT_LENGTHS=\([.[].parts[]? | select(.type=="text") | (.text | length)] | join(",")) PART_TYPES=\([.[].parts[]?.type] | unique | join(",")) ERROR_NAMES=\([.[].info.error?.name // empty] | join(","))"' "$message_json"
              fi
            fi
          fi
          if [[ "$code" == 200 ]] && command -v jq >/dev/null 2>&1; then
            other_model="$(jq -r '.all[]? | select(.id=="opencode") | .models | to_entries[]? | select(.value.cost.input==0 and .value.cost.output==0) | .key' "$provider_json" | grep -v '^big-pickle$' | head -n 1)"
            if [[ -n "$other_model" ]]; then
              echo "NATIVE_ALTERNATIVE_FREE_MODEL=$other_model"
              session_code="$(curl -sS --max-time 18 -X POST -H 'Content-Type: application/json' \
                -d '{"title":"Native alternative free model TEST"}' -o "$session_json" -w '%{http_code}' \
                "http://127.0.0.1:18098/session$suffix")" || session_code=000
              echo "NATIVE_ALTERNATIVE_SESSION_HTTP=$session_code"
              if [[ "$session_code" == 200 ]]; then
                alt_sid="$(jq -r '.id // empty' "$session_json")"
                if [[ "$alt_sid" =~ ^ses_[A-Za-z0-9_-]+$ ]]; then
                  body="$(jq -nc --arg model "$other_model" '{model:{providerID:"opencode",modelID:$model},parts:[{type:"text",text:"Reply with the word PING only. Do not call tools."}]}')"
                  sent_code="$(curl -sS --max-time 20 -X POST -H 'Content-Type: application/json' --data "$body" -o /dev/null -w '%{http_code}' "http://127.0.0.1:18098/session/$alt_sid/prompt_async$suffix")" || sent_code=000
                  echo "NATIVE_ALTERNATIVE_PROMPT_HTTP=$sent_code"
                  sleep 16
                  alt_code="$(curl -sS --max-time 18 -o "$message_json" -w '%{http_code}' "http://127.0.0.1:18098/session/$alt_sid/message$suffix")" || alt_code=000
                  echo "NATIVE_ALTERNATIVE_HISTORY_HTTP=$alt_code"
                  if [[ "$alt_code" == 200 ]]; then
                    jq -r '[.[] | select(.info.role=="assistant")] | "NATIVE_ALT_ASSISTANT_MESSAGES=\(length) TEXT_PARTS=\([.[].parts[]? | select(.type=="text" and (.text|length)>0)] | length) ERRORS=\([.[] | select(.info.error!=null)] | length)"' "$message_json"
                  fi
                  alt_state="$(curl -sS --max-time 15 -o "$status_json" -w '%{http_code}' "http://127.0.0.1:18098/session/status$suffix")" || alt_state=000
                  if [[ "$alt_state" == 200 ]]; then
                    jq -r --arg sid "$alt_sid" '.[$sid].type // "idle_or_unknown" | "NATIVE_ALT_STATE="+.' "$status_json"
                  fi
                fi
              fi
            fi
          fi
          echo "NATIVE_DIRECT_PROBE_END"
          NATIVE_DIAG
      - name: Install Native-only web client on TEST (no Python or database)
        if: steps.confirm.outputs.mode == 'native-install'
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ inputs.vps_username || 'tahir' }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST"             'install -d -m 700 /home/tahir/.native-direct-stage'
          scp -q -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes             assets/native-direct/index.html ops/native-direct/nginx.conf             ops/native-direct/htpasswd ops/native-direct/install.sh             "$USER@$HOST:/home/tahir/.native-direct-stage/"
          : "${VPS_SUDO_PASSWORD:?Missing VPS sudo credential}"
          printf '%s\n' "$VPS_SUDO_PASSWORD" |
            ssh -T -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST"             '/bin/bash /home/tahir/.native-direct-stage/install.sh'
          response="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://test.opencode-gateway.codes/native-direct/)"
          [[ "$response" == 401 ]] || { echo "Native-only page did not require TEST edge login: $response"; exit 1; }
          echo 'DIRECT_NATIVE_TEST_NGINX_INSTALLED'
      - name: Full TEST audit or deploy by pinned GitHub commit
        if: steps.confirm.outputs.mode != 'native-probe' && steps.confirm.outputs.mode != 'native-install'
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ inputs.vps_username || 'tahir' }}
          EXPECTED_VPS_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
          TARGET_SHA: ${{ github.sha }}
          MODE: ${{ steps.confirm.outputs.mode }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          # Read the approved script directly from the reviewed GitHub revision.
          # Git checkout and app source are preserved; no server .env, IP, port,
          # nginx, systemd, database files, Native engine, or LIVE changes.
          operation=audit
          if [[ "$MODE" == "deploy-test" ]]; then operation=deploy; fi
          if [[ "$MODE" == "rollback-test" ]]; then
            operation=rollback
            [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Supply an exact 40-character GitHub commit SHA for rollback"; exit 1; }
            TARGET_SHA="$ROLLBACK_SHA"
          fi
          : "${VPS_SUDO_PASSWORD:?Missing protected VPS_SUDO_PASSWORD secret}"
          [[ "$VPS_SUDO_PASSWORD" != *$'\n'* ]] || { echo "Invalid multi-line sudo secret"; exit 1; }
          # Password travels only over encrypted SSH stdin; never in log or CLI arguments.
          printf '%s\n' "$VPS_SUDO_PASSWORD" | ssh -T -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "cd /home/tahir/opencode-gateway-test && git fetch --no-tags origin updates </dev/null && ( test '$operation' = rollback || test \"\$(git rev-parse origin/updates)\" = '$TARGET_SHA' ) && git show 'origin/updates:scripts/full_test_git_release.py' > /home/tahir/.full-test-git-release.py && chmod 600 /home/tahir/.full-test-git-release.py && TEST_SUDO_PASS_STDIN=1 python3 -I /home/tahir/.full-test-git-release.py $operation '$TARGET_SHA'"
      - name: Verify TEST health after TEST operation
        if: steps.confirm.outputs.mode != 'audit-test' && steps.confirm.outputs.mode != 'native-probe'
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 2 https://test.opencode-gateway.codes/api/health
          echo
      - name: Report scope
        if: always()
        run: |
          echo "TEST fast deploy: push updates skips optional QA suites. Manual audit-test runs backend/browser checks; deployment remains TEST-only with protected secrets, scoped SSH, retained LIVE and Native engine boundaries." >> "$GITHUB_STEP_SUMMARY"
