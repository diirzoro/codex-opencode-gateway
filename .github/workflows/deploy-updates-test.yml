name: Audit and promote updates to TEST
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type audit-test or deploy-test"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: test-native-audit-deploy
  cancel-in-progress: false
jobs:
  test:
    if: github.ref == 'refs/heads/updates'
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 20
    steps:
      - name: Confirm TEST operation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "audit-test" || "$CONFIRMATION" == "deploy-test" ]]
          [[ "$GITHUB_REF" == "refs/heads/updates" ]]
      - uses: actions/checkout@v4
        with:
          ref: updates
          persist-credentials: false
      - name: Validate reviewed 18-file source manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,re,pathlib
          s=pathlib.Path("scripts/native_test_release.py").read_text()
          m=re.search(r"^FILES=\((.*?)\)\s*$",s,re.S|re.M)
          if not m: raise SystemExit("Missing release manifest")
          paths=ast.literal_eval("("+m.group(1)+")")
          if len(paths)!=18 or len(set(paths))!=18: raise SystemExit("Invalid release manifest")
          if any(not pathlib.Path(p).is_file() for p in paths): raise SystemExit("Missing reviewed source")
          pathlib.Path("/tmp/test-native-manifest").write_text("\n".join(paths)+"\n")
          PY
          while IFS= read -r f; do sha256sum "$f"; done < /tmp/test-native-manifest > /tmp/test-native-hashes
          python3 -m py_compile scripts/test_diff_only_rollout.py
      - name: Configure pinned SSH for TEST
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING_HOST}"
          : "${USER:?Missing STAGING_USER}"
          : "${KEY:?Missing STAGING_SSH_PRIVATE_KEY}"
          : "${KNOWN_HOSTS:?Missing STAGING_SSH_KNOWN_HOSTS}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect TEST identity and service health
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            'test "$HOME" = /home/tahir && test -d /home/tahir/opencode-gateway-test/.git && test -f /home/tahir/opencode-gateway-test/.env && systemctl is-active --quiet opencode-gateway-test.service && systemctl is-active --quiet opencode-native-test.service'
      - name: Compare runtime files to GitHub read-only
        if: inputs.confirmation == 'audit-test'
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          while IFS=' ' read -r expected file; do
            test -n "$file" || continue
            actual="$(ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "cd /home/tahir/opencode-gateway-test && if test -f '$file' && test ! -L '$file'; then sha256sum '$file' | cut -d ' ' -f1; else echo MISSING; fi")"
            if [[ "$expected" == "$actual" ]]; then echo "MATCH $file"; else echo "DIFFERENT_OR_MISSING $file"; fi
          done < /tmp/test-native-hashes
          echo "AUDIT_ONLY: no TEST application, configuration, or service changed"
      - name: Package reviewed Native bundle
        if: inputs.confirmation == 'deploy-test'
        run: |
          set -euo pipefail
          tar -cf "test-release-${GITHUB_RUN_ID}.tar" -T /tmp/test-native-manifest
          sha256sum "test-release-${GITHUB_RUN_ID}.tar" > "test-release-${GITHUB_RUN_ID}.tar.sha256"
      - name: Upload bundle and guarded deployment tool
        if: inputs.confirmation == 'deploy-test'
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          stage="/home/tahir/.opencode-test-release-${GITHUB_RUN_ID}"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" "install -d -m 700 '$stage'"
          scp -P "$port" -o StrictHostKeyChecking=yes "test-release-${GITHUB_RUN_ID}.tar" "test-release-${GITHUB_RUN_ID}.tar.sha256" scripts/test_diff_only_rollout.py "$USER@$HOST:$stage/"
      - name: Apply guarded TEST-only diff release
        if: inputs.confirmation == 'deploy-test'
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          stage="/home/tahir/.opencode-test-release-${GITHUB_RUN_ID}"
          ssh -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "sudo -n /usr/bin/python3 -I '$stage/test_diff_only_rollout.py' --bundle '$stage/test-release-${GITHUB_RUN_ID}.tar' --checksum '$stage/test-release-${GITHUB_RUN_ID}.tar.sha256'"
      - name: Report scope
        if: always()
        run: |
          echo "TEST only. No master/LIVE/Native-engine restart. Deployment requires existing SSH and noninteractive scoped sudo permissions." >> "$GITHUB_STEP_SUMMARY"
