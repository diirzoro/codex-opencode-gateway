name: TEST | Deploy changed files only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-file-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - name: Copy changed files to the existing TEST project
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/updates" ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          : "${HOST:?Missing STAGING_HOST}"
          : "${USER:?Missing VPS_USER}"
          : "${KEY:?Missing STAGING_SSH_PRIVATE_KEY}"
          : "${KNOWN_HOSTS:?Missing STAGING_SSH_KNOWN_HOSTS}"
          port="${PORT:-22}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          # Source-file sync ONLY. The existing release script is read directly
          # from the pinned Git commit; no deploy helper is staged on the VPS.
          # No sudo, systemctl, service restarts, Nginx edits, database
          # migrations, health checks, or extra Pi services.
          ssh -T -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER@$HOST" \
            "bash -lc 'set -euo pipefail; cd /home/tahir/opencode-gateway-test; git fetch --no-tags origin updates </dev/null; git show ${TARGET_SHA}:scripts/full_test_git_release.py | python3 -I - deploy ${TARGET_SHA}'"
