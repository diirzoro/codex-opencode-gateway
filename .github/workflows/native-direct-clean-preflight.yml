name: Native-only Python boundary preflight
on:
  push:
    branches:
      - refactor/native-direct-clean
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql+psycopg://qa:qa@127.0.0.1:5432/gateway_qa
      PUBLIC_BASE_URL: http://localhost:8080
      OPENCODE_NATIVE_LOCAL_ENABLED: 'true'
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate full Alembic chain without connecting to a database
        run: python scripts/validate_migration_chain.py
      - name: Compile backend Python
        run: python -m compileall -q backend/app backend/alembic/versions
      - name: Check Native frontend JavaScript
        run: |
          node --check app.js
          node --check dashboards.js
          node --check enhancements.js
          node --check native-session-client.js
          node --check management.js
      - name: Install application dependencies for route inventory
        run: python -m pip install -r backend/requirements.txt
      - name: Verify mounted Native routes cannot call Python Native APIs
        run: |
          cd backend
          python - <<'PY'
          from app.main import app
          from app.routes import native_sessions
          assert native_sessions.enabled()
          assert not hasattr(native_sessions,'metadata')
          assert not hasattr(native_sessions,'sweep_expired_native_history')
          paths = {route.path for route in app.routes}
          assert '/api/native-test/state' in paths
          assert '/api/projects/{project_id}/native-binding' in paths
          assert '/api/workspaces/{workspace_id}' in paths
          forbidden = (
            '/api/native-test/sessions/',
            '/api/native-test/workspaces/',
            '/api/opencode/connections',
            '/api/opencode/catalog/',
            '/api/admin/native/',
            '/api/workspaces/{workspace_id}/providers',
            '/api/workspaces/{workspace_id}/attachments',
            '/api/workspaces/{workspace_id}/runtime',
            '/api/sessions',
          )
          assert not any(path.startswith(prefix) for path in paths for prefix in forbidden), sorted(
              path for path in paths if any(path.startswith(prefix) for prefix in forbidden))
          print('NATIVE_PYTHON_BOUNDARY_PASS', len(paths), 'routes')
          PY
