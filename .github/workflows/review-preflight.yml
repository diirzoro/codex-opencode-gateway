name: Review branch source preflight
on:
  push:
    branches:
      - review/deepseek-clean-migrations
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Alembic revision chain (no DB access)
        run: python scripts/validate_migration_chain.py
      - name: Compile Python source (no dependencies or DB access)
        run: python -m compileall -q backend/app backend/alembic/versions
      - name: Check JavaScript syntax
        run: |
          for file in app.js dashboards.js enhancements.js management.js native-session-client.js runtime-client.js payment-gateways-ui.js; do
            if [ -f "$file" ]; then node --check "$file"; fi
          done
      - name: Check shell script syntax
        run: |
          find deploy ops scripts deployment -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
