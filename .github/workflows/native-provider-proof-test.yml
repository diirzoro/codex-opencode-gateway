name: TEST | inspect real OpenCode Native providers (read-only)
on:
  push:
    branches: [updates]
    paths:
      - '.github/workflows/native-provider-proof-test.yml'
      - 'ops/native-direct/audit-native-provider-state-test.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opencode-native-proof-test
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned TEST SSH
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" && test -n "$KNOWN_HOSTS"
          test "$USER" = tahir
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read current Native provider/model state without exposing secrets
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.TEST_VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          bash -n ops/native-direct/audit-native-provider-state-test.sh
          port="$PORT"
          if test -z "$port"; then port=22; fi
          ssh -T -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -s' \
            < ops/native-direct/audit-native-provider-state-test.sh
