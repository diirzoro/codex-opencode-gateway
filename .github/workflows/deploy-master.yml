name: Promote master to production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type promote to deploy the current master to production'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Require explicit promotion confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "promote" ]; then
            echo "Deployment cancelled. Type exactly: promote"
            exit 1
          fi

      - name: Checkout reviewed master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Prepare SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY secret}"

          port="${VPS_SSH_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -p "$port" -o BatchMode=yes -o ConnectTimeout=15             "$VPS_USER@$VPS_HOST"             'echo "SSH OK: $(whoami)@$(hostname)"'

      - name: Upload release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"

          ssh -p "$port" "$VPS_USER@$VPS_HOST"             'mkdir -p "$HOME/opencode-gateway-release" "$HOME/opencode-backups"'

          rsync -az --delete             --exclude='.git/'             --exclude='.github/'             --exclude='.env'             --exclude='.env.*'             --exclude='.venv*'             --exclude='node_modules/'             --exclude='runtime/'             --exclude='workspaces/'             --exclude='test-results/'             --exclude='playwright-report/'             --exclude='logs/'             --exclude='receipts/'             -e "ssh -p $port"             ./ "$VPS_USER@$VPS_HOST:~/opencode-gateway-release/"

      - name: Deploy application
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_SSH_PORT:-22}"

          ssh -p "$port" "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/opencode-gateway"
          RELEASE_DIR="$HOME/opencode-gateway-release"
          BACKUP_ROOT="$HOME/opencode-backups"
          SERVICE="opencode-gateway"

          test -d "$RELEASE_DIR/backend" || {
            echo "ERROR: uploaded release is missing backend/"
            exit 20
          }

          test -f "$APP_DIR/.env" || {
            echo "ERROR: $APP_DIR/.env is missing"
            exit 21
          }

          systemctl list-unit-files | grep -q '^opencode-gateway\.service' || {
            echo "ERROR: opencode-gateway.service is not installed"
            exit 23
          }

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_dir="$BACKUP_ROOT/$timestamp"
          mkdir -p "$backup_dir"

          # Preserve the currently deployed source before replacement.
          if [ -d "$APP_DIR/backend" ]; then
            tar               --exclude='.env'               --exclude='.env.*'               --exclude='.venv*'               --exclude='runtime'               --exclude='workspaces'               --exclude='logs'               --exclude='receipts'               -czf "$backup_dir/application.tar.gz"               -C "$APP_DIR" .
          fi

          # Load the server-only environment. Keep this file outside Git.
          set -a
          . "$APP_DIR/.env"
          set +a

          : "${DATABASE_URL:?DATABASE_URL is missing from production .env}"

          # Back up PostgreSQL without handing the SQLAlchemy URL directly to pg_dump.
          # Split on the final @ so even a legacy unescaped @ in the password cannot become the host.
          echo "Backing up PostgreSQL..."
          db_url="${DATABASE_URL#*://}"
          db_creds="${db_url%@*}"
          db_location="${db_url##*@}"
          db_user_encoded="${db_creds%%:*}"
          db_password_encoded="${db_creds#*:}"
          db_hostport="${db_location%%/*}"
          db_name_encoded="${db_location#*/}"
          db_name_encoded="${db_name_encoded%%\?*}"

          if [[ "$db_hostport" == *:* ]]; then
            DB_HOST="${db_hostport%:*}"
            DB_PORT="${db_hostport##*:}"
          else
            DB_HOST="$db_hostport"
            DB_PORT="5432"
          fi

          DB_USER="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.unquote(sys.argv[1]))' "$db_user_encoded")"
          DB_PASSWORD="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.unquote(sys.argv[1]))' "$db_password_encoded")"
          DB_NAME="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.unquote(sys.argv[1]))' "$db_name_encoded")"

          PGPASSWORD="$DB_PASSWORD" pg_dump \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -Fc > "$backup_dir/database.dump"

          # pg_dump proved these credentials work. Rebuild a standards-compliant
          # SQLAlchemy URL and persist it so Alembic and the systemd service do not
          # misread special characters such as @ or ! in the password.
          NORMALIZED_DATABASE_URL="$(
            python3 - "$DB_USER" "$DB_PASSWORD" "$DB_HOST" "$DB_PORT" "$DB_NAME" <<'PY'
import sys
from urllib.parse import quote
user, password, host, port, database = sys.argv[1:]
print(
    "postgresql+psycopg://"
    + quote(user, safe="")
    + ":"
    + quote(password, safe="")
    + "@"
    + host
    + ":"
    + port
    + "/"
    + quote(database, safe="")
)
PY
          )"
          export DATABASE_URL="$NORMALIZED_DATABASE_URL"

          cp "$APP_DIR/.env" "$backup_dir/production.env.before-normalize"
          NORMALIZED_DATABASE_URL="$NORMALIZED_DATABASE_URL" python3 - "$APP_DIR/.env" <<'PY'
import os, sys
from pathlib import Path

path = Path(sys.argv[1])
value = os.environ["NORMALIZED_DATABASE_URL"]
lines = path.read_text(encoding="utf-8").splitlines()
out = []
replaced = False
for line in lines:
    if line.startswith("DATABASE_URL="):
        out.append("DATABASE_URL=" + value)
        replaced = True
    else:
        out.append(line)
if not replaced:
    out.append("DATABASE_URL=" + value)
tmp = path.with_suffix(".env.tmp")
tmp.write_text("\n".join(out) + "\n", encoding="utf-8")
tmp.chmod(0o600)
tmp.replace(path)
PY
          chmod 600 "$APP_DIR/.env"
          echo "Production DATABASE_URL normalized after successful database backup."

          unset DB_PASSWORD PGPASSWORD NORMALIZED_DATABASE_URL db_url db_creds db_location db_user_encoded db_password_encoded db_hostport db_name_encoded

          echo "Stopping Gateway..."
          sudo -n systemctl stop "$SERVICE"

          echo "Installing reviewed master release..."
          mkdir -p "$APP_DIR"
          rsync -a --delete             --exclude='.env'             --exclude='.env.*'             --exclude='.venv*'             --exclude='runtime/'             --exclude='workspaces/'             --exclude='logs/'             --exclude='receipts/'             "$RELEASE_DIR/" "$APP_DIR/"

          cd "$APP_DIR"
          if [ ! -x .venv/bin/python ]; then
            python3 -m venv .venv
          fi

          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements.txt

          # Reload production environment after source replacement.
          set -a
          . "$APP_DIR/.env"
          set +a

          echo "Applying database migrations..."
          cd "$APP_DIR/backend"
          ../.venv/bin/python -m alembic upgrade head
          ../.venv/bin/python -m alembic current

          echo "Starting Gateway..."
          sudo -n systemctl start "$SERVICE"
          sudo -n systemctl is-active "$SERVICE"

          echo "Checking Gateway health..."
          curl --fail --silent --show-error             --retry 15             --retry-delay 2             --retry-connrefused             http://127.0.0.1:8000/api/health

          echo
          echo "Checking internal OpenCode reference service..."
          curl --fail --silent --show-error             --max-time 10             http://127.0.0.1:4096/ >/dev/null

          echo "DEPLOYMENT_OK $timestamp"
          REMOTE

      - name: Deployment summary
        if: success()
        run: |
          echo "### Production deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: master" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gateway: restarted and health-checked" >> "$GITHUB_STEP_SUMMARY"
          echo "- OpenCode: remained private on 127.0.0.1:4096 and was health-checked only" >> "$GITHUB_STEP_SUMMARY"
