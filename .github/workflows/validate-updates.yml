name: Validate updates

on:
  push:
    branches: [updates]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Verify a single Alembic head
        working-directory: backend
        run: |
          set -euo pipefail
          python -m alembic heads
          count="$(python -m alembic heads | grep -c '(head)' || true)"
          test "$count" -eq 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js enhancements.js management.js dashboards.js billing.js; do
            if [ -f "$file" ]; then
              node --check "$file"
            fi
          done
