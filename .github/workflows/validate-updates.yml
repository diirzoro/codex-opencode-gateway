name: Validate updates

on:
  push:
    branches: [updates]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/app

      - name: Verify a single Alembic head
        working-directory: backend
        run: |
          set -euo pipefail
          python -m alembic heads
          count="$(python -m alembic heads | grep -c '(head)' || true)"
          test "$count" -eq 1

      - name: Test GitHub customer authorization and repository policy
        run: python -m pytest -q backend/tests/test_github_boundaries.py

      - name: Test one-minute account, recovery and GitHub verification boundaries
        run: |
          python -m pytest -q \
            backend/tests/test_email_verification_contracts.py \
            backend/tests/test_email_code_signup.py \
            backend/tests/test_registration_identity_uniqueness.py \
            backend/tests/test_github_email_ownership.py

      - name: Test Native authorization and ownership regression boundaries
        run: python -m pytest -q backend/tests/test_native_security_performance.py backend/tests/test_native_control_plane.py

      - name: Test Native temporary upload cancellation, large files, types and owner cleanup
        run: python -m pytest -q backend/tests/test_chat_attachments.py backend/tests/test_native_24h_retention.py

      - name: Validate restored TEST deployment and Alembic chain
        run: |
          set -euo pipefail
          python -m py_compile scripts/full_test_git_release.py
          python scripts/validate_migration_chain.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js enhancements.js management.js dashboards.js billing.js; do
            if [ -f "$file" ]; then
              node --check "$file"
            fi
          done
