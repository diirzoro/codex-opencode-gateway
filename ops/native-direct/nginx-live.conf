# LIVE only: reuse the existing pi-central.service Unix socket.
# Included by the existing LIVE Nginx virtual host; never used by TEST.
location ^~ /native-direct/api/ {
    auth_basic off;
    # Gateway validates login at /api/opencode/pi-bootstrap;
    # Pi validates its own short-lived HttpOnly session on every native request.
    auth_request off;
    client_max_body_size 40m;
    limit_except GET POST PATCH PUT DELETE { deny all; }
    rewrite ^/native-direct/api/(.*)$ /$1 break;
    proxy_pass http://unix:/run/pi-central/pi.sock:;
    proxy_http_version 1.1;
    proxy_set_header Host opencode-gateway.codes;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header Cache-Control "no-store" always;
}

# Security preflight is an existing Gateway administrative endpoint,
# not an AI/chat proxy. Its multipart body must accept 25 MiB attachments.
location ~ "^/api/workspaces/[0-9a-fA-F-]{36}/attachments/pi-preflight$" {
    client_max_body_size 40m;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie $http_cookie;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    add_header Cache-Control "no-store" always;
}

# Older OpenCode native console paths must not be served on LIVE.
location ^~ /native-direct/ {
    return 302 /;
}
