# TEST-only Pi Coding Agent. Existing routes retained; OpenCode upstreams retired.
# Browser -> Nginx -> Pi Central UNIX socket. Gateway only validates the session.
location ^~ /native-direct/api/ {
    auth_basic off;
    # Pi authenticates locally using the one-time Gateway account handoff.
    auth_request off;
    client_max_body_size 256k;
    limit_except GET POST PATCH PUT DELETE { deny all; }
    rewrite ^/native-direct/api/(.*)$ /$1 break;
    proxy_pass http://unix:/run/pi-central/pi.sock:;
    proxy_http_version 1.1;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header Host test.opencode-gateway.codes;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    add_header Cache-Control "no-store" always;
}
# Retire the stand-alone OpenCode Native console; main Dashboard is canonical.
location ^~ /native-direct/ {
    return 302 /;
}
