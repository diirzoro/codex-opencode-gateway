# TEST-only Native link. Uses existing Gateway login; no second browser password.
# Browser -> Nginx -> existing local OpenCode Native; no Python or DB.
location ^~ /native-direct/api/ {
    # The browser already has an authenticated Gateway session cookie.
    # Nginx checks that session; Python does not forward or execute Native APIs.
    auth_basic off;
    auth_request /api/auth/me;
    client_max_body_size 256k;
    limit_except GET POST PUT DELETE { deny all; }
    rewrite ^/native-direct/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18098;
    proxy_http_version 1.1;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Host 127.0.0.1:18098;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    add_header Cache-Control "no-store" always;
}
# Provider credentials and authentication methods belong to the existing
# OpenCode Native server, not the session proxy or Python Gateway.
location ^~ /native-direct/api/auth/ {
    auth_basic off;
    auth_request /api/auth/me;
    client_max_body_size 256k;
    limit_except GET PUT DELETE { deny all; }
    rewrite ^/native-direct/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18097;
    proxy_http_version 1.1;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Host 127.0.0.1:18097;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
location = /native-direct/api/provider/auth {
    auth_basic off;
    auth_request /api/auth/me;
    proxy_pass http://127.0.0.1:18097/provider/auth;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Host 127.0.0.1:18097;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
# The project/session internal proxy (18098) does not expose /agent.
# OpenCode Native's discovery endpoint is available via 18097 instead.
location = /native-direct/api/agent {
    # The browser already has an authenticated Gateway session cookie.
    # Nginx checks that session; Python does not forward or execute Native APIs.
    auth_basic off;
    auth_request /api/auth/me;
    proxy_pass http://127.0.0.1:18097/agent;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host 127.0.0.1:18097;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
location = /native-direct/api/provider {
    # Compress OpenCode's own cached provider response in transit. No proxy
    # cache, Gateway registry, model refresh or external catalog request.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json;
    # The browser already has an authenticated Gateway session cookie.
    # Nginx checks that session; Python does not forward or execute Native APIs.
    auth_basic off;
    auth_request /api/auth/me;
    proxy_pass http://127.0.0.1:18097/provider;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host 127.0.0.1:18097;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
location ^~ /native-direct/ {
    # The browser already has an authenticated Gateway session cookie.
    # Nginx checks that session; Python does not forward or execute Native APIs.
    auth_basic off;
    auth_request /api/auth/me;
    alias /var/www/opencode-native-direct-test/;
    index index.html;
    add_header Cache-Control "no-store" always;
}
